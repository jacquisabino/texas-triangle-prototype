<!DOCTYPE html>
<html lan="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE-edge">
    <meta name="viewport" content="width-device-width", 
    initial-scale="1.0">
    <link rel="icon" type="image/png" href="./triangle-logo.png">
    <title>Login Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="website-header">
            <img src="./triangle-logo.png" class="logo">
            <a href="">Log In</a>
        </div>
    </header>

    <main>
        <form action="">
            <fieldset>
                <h1>
                    Find the buildings your landlord 
                    might own in the Houston, Austin, San Antonio or DFW 
                    metros 
                </h1>
                <p>Search By:</p>
                <input type="radio" id="address" name="search_by" value="Address">
                <input type="radio" id="landloed" name="search_by" value="Landlord">
                <input type="text" id="addOrLan" name="addOrLan">
            </fieldset>
        </form>
    </main>
</body>

</html>
